<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monthly Bills</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f5f2;--surface:#fff;--ink:#17201b;--muted:#66726b;--line:#dde3dd;--accent:#1f6f54;--accent-ink:#fff;--neg:#b4372b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--surface:#1b241f;--ink:#eaf1ec;--muted:#93a199;--line:#2c3932;--accent:#5fc79e;--accent-ink:#0b1510;--neg:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--surface:#1b241f;--ink:#eaf1ec;--muted:#93a199;--line:#2c3932;--accent:#5fc79e;--accent-ink:#0b1510;--neg:#ff8a7a;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;font-weight:800;margin:4px 0 14px;letter-spacing:-.02em}
.top{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px;margin-bottom:6px}
.top label{display:block;opacity:.85;font-size:.9rem}
.top .start{display:flex;align-items:center;gap:6px;font-size:2rem;font-weight:800}
.top .start input{font:inherit;color:inherit;background:rgba(255,255,255,.16);border:0;border-radius:8px;padding:2px 10px;width:100%;min-width:0}
.top .sub{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:.95rem}
.top .sub b{font-size:1.15rem}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 8px}
.sec h2{font-size:1.1rem;margin:0;font-weight:800}
.sec span{color:var(--muted);font-size:.9rem}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.row.done .main{opacity:.55}
.main{display:flex;gap:8px;align-items:center}
.main input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:8px;padding:8px;min-width:0}
.nm{flex:1}
.am{width:7.5rem;text-align:right;font-weight:600}
input[type=text]:hover,input[type=number]:hover,input:focus{border-color:var(--line);background:var(--bg)}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px}
.del{border:0;background:none;color:var(--muted);padding:6px 8px;flex:none}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:2px;font-size:.88rem;color:var(--muted)}
.meta button{font-size:.8rem;padding:3px 8px;color:var(--muted)}
.bal.neg,.neg{color:var(--neg)}
.empty{color:var(--muted);text-align:center;padding:14px;border:1px dashed var(--line);border-radius:12px}
form{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 10px}
form input,form select{background:var(--surface);border:1px solid var(--line)}
form .nm{flex:1 1 100%}form .am{flex:1;width:auto;text-align:left}
.add{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tools{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.9rem}
.tools button{font-size:.9rem;padding:6px 10px;flex:none}
</style>
</head>
<body>
<main>
<h1>Monthly bills</h1>
<div class="top">
  <label for="start">Starting total</label>
  <div class="start">$<input id="start" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div>
  <div class="sub"><span>All bills<br><b id="tot">$0.00</b></span><span>Paid so far<br><b id="pd">$0.00</b></span><span>Left after all bills<br><b id="end">$0.00</b></span></div>
</div>
<div id="list"></div>
<form id="f">
  <input class="nm" id="n" type="text" placeholder="Add another bill" maxlength="60" required aria-label="New bill name">
  <input class="am" id="a" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Amount" aria-label="New bill amount">
  <select id="d" aria-label="Due on"><option value="1">Due 1st</option><option value="15">Due 15th</option></select>
  <button class="add" type="submit">Add</button>
</form>
<div class="tools"><span>Tap a name or amount to edit. Check a bill when it’s paid.</span><button id="reset" type="button">New month</button></div>
</main>
<script>
(function(){
  var KEY="monthlyBills.v1";
  var defaults=["Mortgage","Florida mortgage","Florida electric","Florida internet","Verizon wifi","AT&T mobile","Freedom debt","Mass gas and electric"];
  var S=null;
  try{var raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw)}}catch(e){}
  if(!S||!S.items){S={items:defaults.map(function(n,i){return {id:"d"+i,name:n,amount:0,paid:false,day:1}})}}
  S.start=parseFloat(S.start)||0;
  S.items.forEach(function(i){if(i.day!==15)i.day=1});
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  var $=function(id){return document.getElementById(id)};
  var money=function(n){return n.toLocaleString(undefined,{style:"currency",currency:"USD"})};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function ordered(){return S.items.filter(function(i){return i.day===1}).concat(S.items.filter(function(i){return i.day===15}))}
  function setMoney(el,v){el.textContent=money(v);el.classList.toggle("neg",v<0)}
  function totals(){
    var bal=S.start,t=0,p=0,sub={1:0,15:0};
    ordered().forEach(function(i){
      bal-=i.amount;t+=i.amount;sub[i.day]+=i.amount;if(i.paid)p+=i.amount;
      var el=document.querySelector('[data-bal="'+i.id+'"]');if(el)setMoney(el,bal);
    });
    [1,15].forEach(function(d){var el=$("sub"+d);if(el)el.textContent=money(sub[d])});
    $("tot").textContent=money(t);$("pd").textContent=money(p);setMoney($("end"),S.start-t);
  }
  function rowHtml(i){
    return '<div class="row'+(i.paid?' done':'')+'" data-id="'+i.id+'"><div class="main">'+
      '<input type="checkbox" data-k="paid" aria-label="Paid"'+(i.paid?' checked':'')+'>'+
      '<input class="nm" type="text" data-k="name" value="'+esc(i.name)+'" aria-label="Bill name">'+
      '<input class="am" type="number" min="0" step="0.01" inputmode="decimal" data-k="amount" placeholder="$0.00" value="'+(i.amount||'')+'" aria-label="Amount">'+
      '<button class="del" data-del aria-label="Remove '+esc(i.name)+'">✕</button></div>'+
      '<div class="meta"><span>Balance after: <b class="bal" data-bal="'+i.id+'"></b></span><button data-move>Move to '+(i.day===1?'15th':'1st')+'</button></div></div>';
  }
  function render(){
    $("start").value=S.start||"";
    $("list").innerHTML=[1,15].map(function(d){
      var rows=S.items.filter(function(i){return i.day===d});
      return '<div class="sec"><h2>Due on the '+(d===1?'1st':'15th')+'</h2><span>Subtotal <b id="sub'+d+'"></b></span></div>'+
        (rows.map(rowHtml).join("")||'<div class="empty">No bills on the '+(d===1?'1st':'15th')+'.</div>');
    }).join("");
    totals();
  }
  function find(el){var r=el.closest(".row");if(!r)return null;var id=r.getAttribute("data-id");return S.items.filter(function(x){return x.id===id})[0]}
  $("start").addEventListener("input",function(e){S.start=parseFloat(e.target.value)||0;save();totals()});
  $("list").addEventListener("input",function(e){
    var it=find(e.target),k=e.target.getAttribute("data-k");if(!it||!k||k==="paid")return;
    if(k==="name")it.name=e.target.value;else it.amount=parseFloat(e.target.value)||0;
    save();totals();
  });
  $("list").addEventListener("change",function(e){
    var it=find(e.target);if(it&&e.target.getAttribute("data-k")==="paid"){it.paid=e.target.checked;save();render()}
  });
  $("list").addEventListener("click",function(e){
    var it=find(e.target);if(!it)return;
    if(e.target.hasAttribute("data-del")){S.items=S.items.filter(function(x){return x!==it});save();render()}
    else if(e.target.hasAttribute("data-move")){it.day=it.day===1?15:1;save();render()}
  });
  $("f").addEventListener("submit",function(e){
    e.preventDefault();var n=$("n").value.trim();if(!n)return;
    S.items.push({id:"u"+Date.now().toString(36),name:n,amount:parseFloat($("a").value)||0,paid:false,day:parseInt($("d").value,10)});
    $("n").value="";$("a").value="";save();render();$("n").focus();
  });
  $("reset").addEventListener("click",function(){S.items.forEach(function(i){i.paid=false});save();render()});
  render();
})();
</script>
</body>
</html>
